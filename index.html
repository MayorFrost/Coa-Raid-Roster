<script>
/* The builder autosaves through window.storage (the API it was written against).
   Outside that host, back it with localStorage so saving still works. */
if (!window.storage) {
  window.storage = {
    async get(key)        { const v = localStorage.getItem(key);
                            if (v === null) throw new Error('Key not found: ' + key);
                            return { key, value: v, shared: false }; },
    async set(key, value) { localStorage.setItem(key, value); return { key, value, shared: false }; },
    async delete(key)     { localStorage.removeItem(key); return { key, deleted: true, shared: false }; },
    async list(prefix = ''){ return { keys: Object.keys(localStorage).filter(k => k.startsWith(prefix)),
                                      prefix, shared: false }; },
  };
}
</script>

.meterfill{height:100%;border-radius:3px;transition:width .35s cubic-bezier(.4,0,.2,1);}

.pips{display:flex;flex-direction:column;gap:2px;}
.pip{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;font-size:11.5px;transition:background .13s;}
.pip:hover{background:#161C24;}
.pipdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--brass-dim);}
.pipdot.on{background:var(--brass);border-color:var(--brass);box-shadow:0 0 7px rgba(200,160,85,.5);}
.pipname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pip.off .pipname{color:#5D6774;}
.pipby{font-family:var(--mono);font-size:10px;color:var(--muted);}

.warn{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:9px;font-size:11.5px;line-height:1.4;
  background:rgba(217,83,79,.09);border:1px solid rgba(217,83,79,.28);margin-bottom:6px;}
.warn.mild{background:rgba(200,160,85,.08);border-color:rgba(200,160,85,.26);}
.warn svg{flex-shrink:0;margin-top:1px;}
.syn{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:9px;margin-bottom:6px;
  background:rgba(79,191,139,.08);border:1px solid rgba(79,191,139,.24);font-size:11.5px;line-height:1.4;}
.syn b{display:block;font-size:12px;margin-bottom:1px;color:var(--ok);}
.empty{font-size:11.5px;color:#5D6774;font-style:italic;padding:6px 2px;}

/* --- modal --- */
.scrim{position:fixed;inset:0;background:rgba(6,8,12,.78);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:90;padding:18px;animation:fade .16s ease;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:linear-gradient(180deg,#1A212B,#12171E);border:1px solid var(--edge);
  border-radius:15px;padding:18px;width:min(560px,100%);max-height:82vh;overflow:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.6);animation:rise .2s cubic-bezier(.2,.9,.3,1.1);}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
.modal h2{font-family:var(--display);font-size:15px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 4px;}
.modal p{font-size:12.5px;color:var(--muted);margin:0 0 13px;line-height:1.5;}
.ta{width:100%;min-height:150px;background:#0C1016;border:1px solid var(--edge);border-radius:9px;
  color:var(--parchment);font-family:var(--mono);font-size:11px;padding:10px;resize:vertical;line-height:1.5;}
.ta:focus{outline:none;border-color:var(--brass);}
.modalrow{display:flex;gap:8px;justify-content:flex-end;margin-top:13px;flex-wrap:wrap;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;
  background:#1D242E;border:1px solid var(--brass-dim);border-radius:10px;padding:9px 15px;
  font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;
  box-shadow:0 12px 34px rgba(0,0,0,.5);animation:rise .2s ease;}

@media (max-width:1200px){
  .shell{grid-template-columns:250px minmax(0,1fr);}
  .pane.right{grid-column:1/-1;border-left:none;border-top:1px solid var(--edge);}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;}
  .pane.left{border-right:none;border-bottom:1px solid var(--edge);max-height:44vh;}
  .pane{max-height:none;}
  .boardgrid{grid-template-columns:1fr;}
  .brand h1{font-size:15px;}
}
@media (prefers-reduced-motion:reduce){
  .coa *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
